name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: unit tests and demo (no database)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - name: demo output is up to date
        run: python demo/run_demo.py | diff - demo/output.txt

  postgres:
    name: SQL on Postgres 16 with pgvector, client over PostgREST
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      POSTGREST_URL: http://localhost:3000
      POSTGREST_JWT_SECRET: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install pytest "psycopg[binary]"
      - name: migrations apply cleanly, twice
        run: |
          python scripts/apply_sql.py --with-shim
          python scripts/apply_sql.py --with-shim
      - name: start PostgREST in front of the same database
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI=postgres://postgres:postgres@localhost:5432/postgres \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_DB_EXTRA_SEARCH_PATH=public,extensions \
            -e PGRST_JWT_SECRET="$POSTGREST_JWT_SECRET" \
            postgrest/postgrest:v16.6
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:3000/ && exit 0
            sleep 1
          done
          docker logs postgrest
          exit 1
      - name: integration tests, none skipped
        shell: bash
        run: |
          python -m pytest -q -rs tests/integration | tee result.txt
          ! grep -q skipped result.txt
